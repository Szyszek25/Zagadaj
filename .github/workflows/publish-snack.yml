name: Publish Expo Snack

on:
  push:
    branches: [main]
    paths-ignore:
      - SNACK.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Snack SDK
        run: |
          mkdir -p /tmp/snack-publisher
          cp scripts/publish-snack.mjs /tmp/snack-publisher/publish-snack.mjs
          cd /tmp/snack-publisher
          npm init -y >/dev/null 2>&1
          npm install snack-sdk --no-audit --no-fund
      - name: Publish anonymous Snack
        run: |
          cd /tmp/snack-publisher
          node publish-snack.mjs
      - name: Save public URL to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SNACK.md
          git commit -m "chore: update public Expo Go URL [skip ci]" || exit 0
          git push
