name: Validate Expo app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Expo doctor
        run: npm run doctor
      - name: Publish multi-file Snack
        run: npm run snack:publish
      - name: Attach Snack URL to commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('SNACK_URL.txt', 'utf8');
            const editor = text.match(/^Editor:\s*(.+)$/m)?.[1]?.trim();
            if (!editor) throw new Error('Snack editor URL missing');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Expo Snack',
              description: 'Open tested multi-file Expo Snack',
              target_url: editor,
            });
